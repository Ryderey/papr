[workspace]
members = [
    "src-tauri",
    "crates/papr-core",
    "crates/papr-flutter-bridge",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["you"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"

# data layer
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
rusqlite_migration = "1"

# ingestion
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli", "json", "charset", "http2", "system-proxy"] }
scraper = "0.21"
url = "2"
opml = "1"
encoding_rs = "0.8"

# content
ammonia = "4.1.2"
dom_smoothie = "0.17"
lol_html = "2"

# misc
flutter_rust_bridge = "2"
