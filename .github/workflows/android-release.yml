name: Android Release (superseded)

# Builds and publishes signed Android APKs from an Android tag or a manual run.
# Desktop bundles stay on the `v*` workflow; the `android-v*` prefix keeps the
# two release lines independent, so an Android RC never rebuilds Tauri bundles.
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. android-v0.9.0-rc1)"
        required: true
        type: string
      draft:
        description: "Keep the release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        default: true
      artifact_only:
        description: "Only upload workflow artifacts, create no release"
        type: boolean
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.5"
  NDK_VERSION: "30.0.14904198"
  # Release packaging only needs device ABIs; x86/x86_64 target emulators.
  PAPR_ANDROID_ABIS: "arm64-v8a,armeabi-v7a"
  TARGET_PLATFORMS: "android-arm,android-arm64"

jobs:
  apk:
    # Keep the previous draft for reference; package-release.yml owns publishing.
    if: github.repository == 'l0ng-ai/papr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # A tag that disagrees with pubspec would publish a mislabelled artifact,
      # e.g. tag android-v0.9.0 carrying versionName 0.1.0.
      - name: Verify tag against pubspec version
        id: ver
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          RAW=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -1 | tr -d '\r')
          NAME="${RAW%%+*}"
          CODE="${RAW##*+}"
          if [ "$CODE" = "$RAW" ]; then
            echo "::error::mobile/pubspec.yaml needs name+build number, got '$RAW'"
            exit 1
          fi
          case "$TAG" in
            "android-v${NAME}" | "android-v${NAME}-"*) ;;
            *)
              echo "::error::tag $TAG does not match pubspec version $RAW (expected android-v${NAME}[…])"
              exit 1
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME+$CODE from $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "platforms;android-36" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Installed for every supported ABI; only the selected ones get built.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle.kts', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The linker mapping normally lives in the developer's ~/.cargo/config.toml,
      # so a runner without it fails at the Rust link step.
      - name: Configure Cargo Android linkers
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$HOME/.cargo"
          {
            echo "[target.aarch64-linux-android]"
            echo "linker = \"$TOOLCHAIN/aarch64-linux-android21-clang\""
            echo "[target.armv7-linux-androideabi]"
            echo "linker = \"$TOOLCHAIN/armv7a-linux-androideabi21-clang\""
            echo "[target.i686-linux-android]"
            echo "linker = \"$TOOLCHAIN/i686-linux-android21-clang\""
            echo "[target.x86_64-linux-android]"
            echo "linker = \"$TOOLCHAIN/x86_64-linux-android21-clang\""
          } >> "$HOME/.cargo/config.toml"
          {
            echo "CC_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android21-clang"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar"
            echo "CC_armv7-linux-androideabi=$TOOLCHAIN/armv7a-linux-androideabi21-clang"
            echo "AR_armv7-linux-androideabi=$TOOLCHAIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::missing repository secret $name"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > mobile/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs
        working-directory: mobile
        env:
          ORG_GRADLE_PROJECT_paprAndroidAbis: ${{ env.PAPR_ANDROID_ABIS }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --split-per-abi \
            --target-platform "$TARGET_PLATFORMS"

      - name: Collect release evidence
        run: |
          set -euo pipefail
          APK_DIR="$GITHUB_WORKSPACE/mobile/build/app/outputs/flutter-apk"
          OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          ( cd "$APK_DIR" && sha256sum ./*-release.apk > "$OUT/checksums.txt" )
          "$APKSIGNER" verify --print-certs "$APK_DIR/app-arm64-v8a-release.apk" > "$OUT/signer.txt"
          "$AAPT2" dump badging "$APK_DIR/app-arm64-v8a-release.apk" \
            | grep -E "sdkVersion|targetSdkVersion" > "$OUT/badging.txt" || true
          cat "$OUT/checksums.txt" "$OUT/signer.txt" "$OUT/badging.txt"

      - name: Compose release notes
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          {
            echo "Signed Android build \`${NAME}+${CODE}\` (versionCode ${CODE})."
            echo
            echo "| Artifact | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum file; do
              echo "| \`$(basename "$file")\` | \`$sum\` |"
            done < "$OUT/checksums.txt"
            echo
            grep -E "sdkVersion|targetSdkVersion" "$OUT/badging.txt" 2>/dev/null || true
            echo
            sid=$(grep -m1 "SHA-256 digest" "$OUT/signer.txt" | awk '{print $NF}' || true)
            echo "Signer cert SHA-256: \`$sid\`"
            echo
            echo "- Android will ask to allow installs from unknown sources; Play Protect may warn."
            echo "- In-place updates require this same signing certificate."
            echo "- Data and privacy notes: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/mobile-privacy.md"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Upload workflow artifacts
        if: ${{ inputs.artifact_only }}
        uses: actions/upload-artifact@v4
        with:
          name: papr-android-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            mobile/build/app/outputs/flutter-apk/*-release.apk
            ${{ runner.temp }}/evidence/*

      - name: Publish GitHub release
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          APKS=(mobile/build/app/outputs/flutter-apk/*-release.apk)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${APKS[@]}" "$RUNNER_TEMP/evidence/checksums.txt" --clobber
          else
            FLAGS=(
              --title "Papr Android ${NAME}+${CODE}"
              --notes-file "$RUNNER_TEMP/release-notes.md"
              --target "${{ github.sha }}"
            )
            if [ "${{ inputs.prerelease }}" != "false" ]; then
              FLAGS+=(--prerelease)
            fi
            if [ "${{ inputs.draft }}" != "false" ]; then
              FLAGS+=(--draft)
            fi
            gh release create "$TAG" "${FLAGS[@]}" "${APKS[@]}" "$RUNNER_TEMP/evidence/checksums.txt"
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f mobile/android/key.properties "$RUNNER_TEMP/upload.keystore"
