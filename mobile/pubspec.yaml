name: papr_mobile
description: Papr mobile reader (Flutter Android).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: ^2.12.0
  flutter_riverpod: ^2.6.1
  flutter_widget_from_html_core: ^0.17.2
  intl: 0.20.2
  path_provider: ^2.1.5
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.0
  build_runner: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
